<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livro de Despesas</title>
<style>
  :root{
    --paper: #EDE7D6;
    --paper-2: #E4DCC6;
    --ink: #262A22;
    --ink-soft: #565D4E;
    --line: #C7BC9E;
    --rust: #9C4A2E;
    --rust-bg: #F1E0D8;
    --sage: #4F6B4A;
    --sage-bg: #E4EADD;
    --brass: #8C6A2F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    min-height:100vh;
    padding:0;
  }
  .page{
    max-width:640px;
    margin:0 auto;
    padding: 40px 28px 80px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 28px;
  }
  h1{
    font-size: 26px;
    font-weight: normal;
    margin:0;
    letter-spacing: 0.3px;
  }
  .month-nav{
    display:flex;
    align-items:center;
    gap: 10px;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .month-nav button{
    background:none;
    border:none;
    color: var(--ink);
    cursor:pointer;
    font-size: 16px;
    padding: 2px 6px;
    line-height: 1;
  }
  .month-nav button:hover{ color: var(--brass); }
  .month-label{
    min-width: 108px;
    text-align:center;
    text-transform: capitalize;
  }

  .balance-block{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 8px;
  }
  .balance-label{
    font-family: system-ui, sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .balance-value{
    font-size: 40px;
  }
  .balance-value.over{ color: var(--rust); }

  .summary-row{
    display:flex;
    gap: 24px;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .summary-row strong{
    color: var(--ink);
    font-family: Georgia, serif;
    font-size: 15px;
  }

  form.entry-form{
    display:grid;
    grid-template-columns: 90px 1fr 130px 100px 36px;
    gap: 8px;
    align-items:center;
    margin-bottom: 6px;
    font-family: system-ui, sans-serif;
  }
  form.entry-form input, form.entry-form select{
    font-family: system-ui, sans-serif;
    font-size: 13px;
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    padding: 6px 2px;
    color: var(--ink);
    width: 100%;
  }
  form.entry-form input:focus, form.entry-form select:focus{
    outline:none;
    border-bottom: 1px solid var(--brass);
  }
  form.entry-form input[type="number"]{
    text-align:right;
  }
  .add-btn{
    width:32px; height:32px;
    border-radius:50%;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    font-size: 18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    line-height:1;
    padding:0;
  }
  .add-btn:hover{ background: var(--brass); border-color: var(--brass); }
  .error-msg{
    font-family: system-ui, sans-serif;
    font-size: 12px;
    color: var(--rust);
    margin: -2px 0 14px 2px;
    min-height: 14px;
  }

  .register{
    border-top: 1px solid var(--ink);
    margin-top: 18px;
  }
  .entry-row{
    display:grid;
    grid-template-columns: 90px 1fr 130px 100px 36px;
    gap: 8px;
    align-items:center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .entry-date{
    font-family: system-ui, sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .entry-desc{
    font-size: 16px;
  }
  .entry-cat{
    font-family: system-ui, sans-serif;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 2px;
    justify-self:start;
    white-space:nowrap;
  }
  .cat-alimentacao{ background: var(--rust-bg); color: var(--rust); }
  .cat-transporte{ background: #E3E6EE; color: #3F4E7A; }
  .cat-moradia{ background: #EAE3EE; color: #5B3F7A; }
  .cat-lazer{ background: #F1EAD0; color: var(--brass); }
  .cat-saude{ background: var(--sage-bg); color: var(--sage); }
  .cat-outros{ background: #E8E6E1; color: var(--ink-soft); }
  .cat-custom{ background: #F1EAD0; color: var(--brass); }

  .entry-amount{
    font-size: 16px;
    text-align:right;
    color: var(--rust);
  }
  .del-btn{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-family: system-ui, sans-serif;
    font-size: 16px;
    cursor:pointer;
    text-align:right;
    padding: 0;
  }
  .del-btn:hover{ color: var(--rust); }

  .empty-state{
    padding: 40px 0;
    text-align:center;
    color: var(--ink-soft);
    font-style: italic;
  }

  .loading{
    padding: 40px 0;
    text-align:center;
    color: var(--ink-soft);
    font-family: system-ui, sans-serif;
    font-size: 13px;
  }

  @media (max-width: 480px){
    .page{ padding: 24px 16px 60px; }
    form.entry-form, .entry-row{
      grid-template-columns: 70px 1fr 70px 32px;
    }
    .entry-form select, .entry-cat{ display:none; }
    .balance-value{ font-size: 32px; }
    .summary-row{ flex-wrap:wrap; gap: 14px; }
  }
</style>
</head>
<body>
<div class="page" id="app">
  <div class="loading" id="loading">Abrindo o livro…</div>
</div>

<script>
const DEFAULT_CATEGORIES = [
  { id: 'alimentacao', label: 'Alimentação' },
  { id: 'transporte', label: 'Transporte' },
  { id: 'moradia', label: 'Moradia' },
  { id: 'lazer', label: 'Lazer' },
  { id: 'saude', label: 'Saúde' },
  { id: 'outros', label: 'Outros' },
];
const NEW_CATEGORY_VALUE = '__nova_categoria__';

const STORAGE_KEY = 'expenses:entries';
const CATEGORIES_KEY = 'expenses:categories';
let entries = [];
let customCategories = [];
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let formError = '';
let selectedCategory = DEFAULT_CATEGORIES[0].id;

function allCategories(){
  return [...DEFAULT_CATEGORIES, ...customCategories];
}

function fmtMoney(v){
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function monthLabel(m, y){
  const d = new Date(y, m, 1);
  return d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
}

function catInfo(id){
  return allCategories().find(c => c.id === id) || DEFAULT_CATEGORIES[DEFAULT_CATEGORIES.length - 1];
}

function slugify(text){
  return text.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '') || 'categoria-' + Date.now().toString(36);
}

async function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){
    entries = [];
  }
  try{
    const rawCats = localStorage.getItem(CATEGORIES_KEY);
    customCategories = rawCats ? JSON.parse(rawCats) : [];
  }catch(e){
    customCategories = [];
  }
  render();
}

async function saveEntries(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }catch(e){
    console.error('Falha ao salvar', e);
  }
}

async function saveCategories(){
  try{
    localStorage.setItem(CATEGORIES_KEY, JSON.stringify(customCategories));
  }catch(e){
    console.error('Falha ao salvar categorias', e);
  }
}

function entriesForMonth(){
  return entries.filter(e => {
    const d = new Date(e.date + 'T00:00:00');
    return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
  }).sort((a,b) => b.date.localeCompare(a.date));
}

function changeMonth(delta){
  currentMonth += delta;
  if(currentMonth < 0){ currentMonth = 11; currentYear--; }
  if(currentMonth > 11){ currentMonth = 0; currentYear++; }
  render();
}

async function addEntry(desc, amount, category, date){
  entries.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    description: desc,
    amount: Math.round(amount * 100) / 100,
    category,
    date
  });
  await saveEntries();
  render();
}

async function deleteEntry(id){
  entries = entries.filter(e => e.id !== id);
  await saveEntries();
  render();
}

function render(){
  const monthEntries = entriesForMonth();
  const total = monthEntries.reduce((s,e) => s + e.amount, 0);

  const app = document.getElementById('app');
  app.innerHTML = `
    <header>
      <h1>Livro de despesas</h1>
      <div class="month-nav">
        <button id="prev-month" aria-label="Mês anterior">‹</button>
        <span class="month-label">${monthLabel(currentMonth, currentYear)}</span>
        <button id="next-month" aria-label="Próximo mês">›</button>
      </div>
    </header>

    <div class="balance-block">
      <span class="balance-label">Total do mês</span>
      <span class="balance-value">${fmtMoney(total)}</span>
    </div>
    <div class="summary-row">
      <span>${monthEntries.length} lançamento${monthEntries.length === 1 ? '' : 's'}</span>
      ${monthEntries.length ? `<span>Maior gasto: <strong>${fmtMoney(Math.max(...monthEntries.map(e=>e.amount)))}</strong></span>` : ''}
    </div>

    <form class="entry-form" id="entry-form" autocomplete="off">
      <input type="date" id="f-date" value="${todayISO()}" required />
      <input type="text" id="f-desc" placeholder="Descrição" required />
      <select id="f-cat">
        ${allCategories().map(c => `<option value="${c.id}" ${c.id === selectedCategory ? 'selected' : ''}>${c.label}</option>`).join('')}
        <option value="${NEW_CATEGORY_VALUE}">+ Nova categoria</option>
      </select>
      <input type="number" id="f-amount" placeholder="0,00" step="0.01" min="0" inputmode="decimal" required />
      <button type="submit" class="add-btn" aria-label="Adicionar lançamento">+</button>
    </form>
    <div class="error-msg">${formError}</div>

    <div class="register">
      ${monthEntries.length === 0
        ? `<div class="empty-state">Nenhum lançamento neste mês ainda.</div>`
        : monthEntries.map(e => {
            const c = catInfo(e.category);
            const d = new Date(e.date + 'T00:00:00');
            const dLabel = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
            const isDefault = DEFAULT_CATEGORIES.some(dc => dc.id === c.id);
            return `
              <div class="entry-row">
                <span class="entry-date">${dLabel}</span>
                <span class="entry-desc">${escapeHtml(e.description)}</span>
                <span class="entry-cat ${isDefault ? 'cat-' + c.id : 'cat-custom'}">${escapeHtml(c.label)}</span>
                <span class="entry-amount">− ${fmtMoney(e.amount)}</span>
                <button class="del-btn" data-id="${e.id}" aria-label="Excluir lançamento">✕</button>
              </div>
            `;
          }).join('')
      }
    </div>
  `;

  document.getElementById('prev-month').onclick = () => changeMonth(-1);
  document.getElementById('next-month').onclick = () => changeMonth(1);

  document.getElementById('f-cat').onchange = async (ev) => {
    if(ev.target.value === NEW_CATEGORY_VALUE){
      const name = window.prompt('Nome da nova categoria:');
      if(name && name.trim()){
        const label = name.trim();
        const id = slugify(label);
        if(!allCategories().some(c => c.id === id)){
          customCategories.push({ id, label });
          await saveCategories();
        }
        selectedCategory = id;
      }
      render();
      return;
    }
    selectedCategory = ev.target.value;
  };

  document.getElementById('entry-form').onsubmit = async (ev) => {
    ev.preventDefault();
    const desc = document.getElementById('f-desc').value.trim();
    const amountRaw = document.getElementById('f-amount').value;
    const amount = parseFloat(amountRaw);
    const category = document.getElementById('f-cat').value;
    const date = document.getElementById('f-date').value;

    if(!desc){
      formError = 'Escreva uma descrição.';
      render();
      return;
    }
    if(!amountRaw || isNaN(amount) || amount <= 0){
      formError = 'Informe um valor maior que zero.';
      render();
      return;
    }
    if(!date){
      formError = 'Escolha uma data.';
      render();
      return;
    }
    formError = '';
    await addEntry(desc, amount, category, date);
  };

  app.querySelectorAll('.del-btn').forEach(btn => {
    btn.onclick = () => deleteEntry(btn.dataset.id);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadEntries();
</script>
</body>
</html>
